name: Android CI

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'          # also run on version tags like v1.2.3
  pull_request:
    branches: [main, master]

  # Allow triggering a build manually from the Actions tab
  workflow_dispatch:

concurrency:
  # Cancel in-flight runs for the same branch/PR to save minutes
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:

          channel: stable
          cache: true

      - name: Flutter version info
        run: flutter --version


      - name: Install pub dependencies
        run: flutter pub get

      - name: Analyze (dart analyze)
        run: flutter analyze --no-fatal-infos


      - name: Build debug APK
        run: flutter build apk --debug


      - name: Build release APK
        if: github.event_name != 'pull_request'
        run: flutter build apk --release

      - name: Build release APKs (split by ABI)
        if: github.event_name != 'pull_request'
        run: flutter build apk --release --split-per-abi


      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      - name: Upload release APKs
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: build/app/outputs/flutter-apk/app-*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-*.apk
          generate_release_notes: true
